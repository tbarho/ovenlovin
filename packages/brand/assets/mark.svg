<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="OvenLovin">
  <title>OvenLovin</title>
  <defs>
    <linearGradient id="ol-body" x1="20" y1="18" x2="110" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4A261"/>
      <stop offset="0.45" stop-color="#E07A3D"/>
      <stop offset="1" stop-color="#C45D28"/>
    </linearGradient>
    <linearGradient id="ol-body-side" x1="96" y1="28" x2="118" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D66A30"/>
      <stop offset="1" stop-color="#A3441C"/>
    </linearGradient>
    <linearGradient id="ol-top" x1="24" y1="16" x2="100" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6B77A"/>
      <stop offset="1" stop-color="#E38B4A"/>
    </linearGradient>
    <radialGradient id="ol-glow" cx="56" cy="68" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.45" stop-color="#FFB020"/>
      <stop offset="1" stop-color="#E07A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ol-loaf" x1="40" y1="64" x2="78" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3D19A"/>
      <stop offset="0.55" stop-color="#D4A05A"/>
      <stop offset="1" stop-color="#B87A32"/>
    </linearGradient>
    <linearGradient id="ol-knob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3D6"/>
      <stop offset="1" stop-color="#E8C27A"/>
    </linearGradient>
    <filter id="ol-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#C45D28" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="64" cy="116" rx="38" ry="6" fill="#C45D28" opacity="0.16"/>

  <g filter="url(#ol-soft)">
    <!-- side plane (3/4) -->
    <path d="M96 30 L114 40 V100 L96 110 Z" fill="url(#ol-body-side)"/>
    <!-- main body -->
    <rect x="18" y="28" width="78" height="82" rx="16" fill="url(#ol-body)"/>
    <!-- top plate -->
    <path d="M26 22 C26 16 36 12 64 12 C92 12 102 16 102 22 L114 40 L96 30 L26 28 Z" fill="url(#ol-top)"/>
    <!-- chimney -->
    <rect x="78" y="8" width="14" height="14" rx="3" fill="#E38B4A"/>
    <rect x="76" y="6" width="18" height="5" rx="2.5" fill="#F4A261"/>

    <!-- door recess -->
    <rect x="28" y="42" width="58" height="52" rx="12" fill="#6B2E14"/>
    <!-- window -->
    <rect x="32" y="46" width="50" height="36" rx="9" fill="#2A1208"/>
    <rect x="32" y="46" width="50" height="36" rx="9" fill="url(#ol-glow)"/>
    <!-- loaf in the window -->
    <ellipse cx="57" cy="72" rx="16" ry="8" fill="url(#ol-loaf)"/>
    <path d="M44 70 C48 64 52 62 57 62 C62 62 66 64 70 70" stroke="#B87A32" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M50 68 C52 65 54 64 57 64" stroke="#F3D19A" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <!-- fire glow dots -->
    <circle cx="42" cy="74" r="2.2" fill="#FF8001" opacity="0.85"/>
    <circle cx="72" cy="75" r="1.8" fill="#FFB020" opacity="0.8"/>

    <!-- handle -->
    <rect x="46" y="86" width="22" height="5" rx="2.5" fill="url(#ol-knob)"/>
    <!-- knobs -->
    <circle cx="36" cy="100" r="4.2" fill="url(#ol-knob)"/>
    <circle cx="50" cy="100" r="4.2" fill="url(#ol-knob)"/>
    <circle cx="36" cy="100" r="1.6" fill="#C45D28" opacity="0.35"/>
    <circle cx="50" cy="100" r="1.6" fill="#C45D28" opacity="0.35"/>

    <!-- highlight -->
    <path d="M30 36 C34 32 48 30 58 30" stroke="#FFF6E8" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- steam -->
  <path d="M84 10 C82 4 88 2 86 -2" stroke="#F4A261" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M90 8 C89 3 94 2 93 -3" stroke="#F6B77A" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
</svg>
