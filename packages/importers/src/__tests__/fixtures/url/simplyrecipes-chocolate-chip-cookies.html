<!DOCTYPE html><html><head><title>Chewy Chocolate Chip Cookies</title><script type="application/ld+json">{"@type": "Recipe", "name": "Chewy Chocolate Chip Cookies", "description": "These homemade chocolate chip cookies are the BEST! One special ingredient helps deepens the flavor and gives the chocolate chip cookies a chewier texture. Save this chocolate chip cookie recipe. It&#39;s that good.", "prepTime": "PT5M", "cookTime": "PT12M", "totalTime": "PT47M", "recipeYield": ["42", "3 1/2 dozen"], "recipeCategory": ["Dessert", "Snack", "Baking", "Cookie"], "recipeCuisine": ["American"], "author": {"@type": "Person", "name": "Emma Christensen"}, "image": "https://www.simplyrecipes.com/thmb/ni7NjzgnFd9_s356xTu8uSKCUrQ=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/__opt__aboutcom__coeus__resources__content_migration__simply_recipes__uploads__2017__05__2017-06-13-ChocolateChipCookies-17-04094386d7514bdebe4a07a67f2849df.jpg", "recipeIngredient": ["2 1/2 (350 g) cups all-purpose four", "2-4 tablespoons nonfat milk powder (see Recipe Note)", "1 teaspoon salt", "1 teaspoon baking soda", "3/4 cup (150 g) granulated sugar", "3/4 cup (161 g) dark brown sugar", "1 cup (2 sticks, or 8 ounces) unsalted butter, very soft", "2 large eggs", "1 teaspoon vanilla extract", "12 ounce bag (about 2 cups) semisweet chocolate chips"], "recipeInstructions": [{"@type": "HowToStep", "text": "In a medium mixing bowl, combine the flour, milk powder, salt, and baking soda and whisk to mix. Set aside."}, {"@type": "HowToStep", "text": "With an electric mixer or in a stand mixer with a beater attachment, beat together the granulated sugar, brown sugar, and softened butter on medium speed until combined, 30 to 60 seconds. Pick out any large pebbles of hard brown sugar that you see. Scrape down the sides of the bowl and the beaters."}, {"@type": "HowToStep", "text": "Add the two eggs and vanilla to the butter-sugar mixture and beat at medium speed until no clumps or streaks remain, 10 to 20 seconds. Scrape down the sides of the bowl and the beaters."}, {"@type": "HowToStep", "text": "Add the flour mixture all at once. Beat on low speed just until no more dry streaks of flour are visible, 20 to 40 seconds. You may still see some flecks of milk powder -- this is fine."}, {"@type": "HowToStep", "text": "Add all of the chocolate chips and beat on low speed for just a few seconds until the chips are evenly incorporated."}, {"@type": "HowToStep", "text": "Scrape down the sides of the bowl and the beater. Cover the bowl and refrigerate for at least 30 minutes or up to three days. (Or freeze in individual scoops for up to 3 months.)"}, {"@type": "HowToStep", "text": "Place a rack in the middle of the oven. Line two baking sheet with silicon baking mats or parchment. I usually bake my cookies one sheet at a time to help them bake evenly. If you prefer, or are crunched for time, bake two sheets at a time with one sheet in the upper third of the oven and the other in the lower third of the oven."}, {"@type": "HowToStep", "text": "Use a medium cookie scoop (or a well-mounded tablespoon measure) to scoop the dough out onto one of the baking sheet. Space the cookies about 2 inches apart."}, {"@type": "HowToStep", "text": "While the first batch bakes, scoop the cookies for the next batch. The cookies are done when they look slightly puffed in the middle and are starting to turn toasty at the edges."}, {"@type": "HowToStep", "text": "Cool the cookies on the baking sheet for about 5 minutes, or until the puffed middles collapse and the cookies have firmed a little. Transfer the cookies to a wire cooling rack to cool completely."}, {"@type": "HowToStep", "text": "These cookies are at their best on the day they are made. Store leftovers in an airtight container; they will soften a little overnight but are still very delicious. They keep for about a week before becoming crumbly (at which point, I recommend crumbling them over ice cream!)."}, {"@type": "HowToStep", "text": "Enjoy!"}]}</script></head><body><h1>Chewy Chocolate Chip Cookies</h1></body></html>
