per or a nonstick baking mat. Set aside."}, {"@type": "HowToStep", "text": "Scoop 6 3 \u00bd-ounce mounds of dough (the size of generous golf balls) onto baking sheet, making sure to turn horizontally any chocolate pieces that are poking up; it will make for a more attractive cookie. Sprinkle lightly with salt and bake until golden brown but still soft, 18 to 20 minutes. Transfer sheet to a wire rack for 10 minutes, then slip cookies onto another rack to cool a bit more. Repea"}]}</script></head><body><h1>Best Chocolate Chip Cookies</h1></body></html>
