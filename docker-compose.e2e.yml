services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ovenlovin
      POSTGRES_PASSWORD: ovenlovin
      POSTGRES_DB: ovenlovin
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovenlovin -d ovenlovin"]
      interval: 2s
      timeout: 5s
      retries: 20
