name: Link Check

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - ".github/workflows/link-check.yml"
      - "scripts/check-docs-links.mjs"
      - "scripts/check-docs-links.test.mjs"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/link-check.yml"
      - "scripts/check-docs-links.mjs"
      - "scripts/check-docs-links.test.mjs"

jobs:
  link-check:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build documentation
        run: pnpm --filter @ovenlovin/docs build
      
      - name: Prove the checker catches today's relative 404
        run: node --test scripts/check-docs-links.test.mjs

      - name: Check documentation links
        run: node scripts/check-docs-links.mjs
      
      - name: Summary
        run: |
          echo "## Link Check Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ All documentation links are valid" >> $GITHUB_STEP_SUMMARY
          echo "✅ basePath '/ovenlovin' is correctly applied" >> $GITHUB_STEP_SUMMARY
